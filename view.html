<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batu Kunci — Tim Media Kreatif (Mode View)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="view-bg" aria-hidden="true">
  <div class="view-blob b1"></div>
  <div class="view-blob b2"></div>
  <div class="view-blob b3"></div>
  <div class="view-blob b4"></div>
</div>
<div class="shell view-shell">
  <div class="topbar">
    <div class="brandmark">
      <svg class="arch-mark" width="30" height="30" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="arch-body" d="M6 42V22C6 11 14 4 24 4C34 4 42 11 42 22V42H33V22C33 16 29 13 24 13C19 13 15 16 15 22V42H6Z"/>
        <path class="arch-key" d="M20 4H28L26 12H22L20 4Z"/>
      </svg>
      <span class="brand-word">Batu Kunci</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <span class="drive-tag">Mode View</span>
    </div>
  </div>

  <section class="page">
    <h1 class="page-title">Progress Tim Media Kreatif</h1>
    <p class="page-desc">Tampilan publik — buat dilihat, bukan buat diedit.</p>
    <div id="view-project-list"></div>

    <div class="keystone-divider"><span>Gallery</span></div>
    <div id="view-gallery-empty" class="empty-state hidden"><p>Gallery masih kosong.</p></div>

    <div id="album-carousel-view">
      <div class="album-carousel-wrap"><div class="album-carousel" id="album-carousel"></div></div>
    </div>

    <div id="album-detail-view" class="hidden">
      <button class="btn btn-ghost btn-sm" onclick="closeAlbum()">← Semua Album</button>
      <h3 class="album-detail-title" id="album-detail-title"></h3>
      <div class="gallery-grid" id="album-detail-grid"></div>
    </div>

    <p class="login-note" style="text-align:center; margin-top:32px;">
      Tim Media Kreatif — Kepengurusan Angkatan 26.2, Administrasi Bisnis UT Bandung
    </p>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script src="data.js"></script>
<script src="view.js"></script>
</body>
</html>
